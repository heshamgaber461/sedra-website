<style>
:root{
  --navy:#143F63; --navy-d:#0d2c47; --navy-dd:#081c2e; --ink0:#05131f;
  --cyan:#1FA6C4; --cyan-l:#38d0ec; --cyan-d:#127a94;
  --ink:#0f1e29; --muted:#5A6B7B; --line:#e6edf3; --bg:#f4f8fb; --white:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased}
body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.6;overflow-x:hidden}
h1,h2,h3,h4,.disp{font-family:'Outfit',sans-serif;line-height:1.05;letter-spacing:-1px}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-family:'Outfit';font-weight:600;font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:var(--cyan-l)}
.eyebrow::before{content:"";width:30px;height:2px;background:var(--cyan)}
.btn{display:inline-flex;align-items:center;gap:9px;font-family:'Outfit';font-weight:600;font-size:15px;padding:14px 26px;border-radius:50px;border:none;cursor:pointer;transition:.3s}
.btn-primary{background:var(--cyan);color:#04222c}
.btn-primary:hover{background:var(--cyan-l);transform:translateY(-3px);box-shadow:0 16px 36px rgba(31,166,196,.45)}
.btn-ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.btn-ghost:hover{background:#fff;color:var(--navy);transform:translateY(-3px)}

/* ===== header ===== */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(8,28,46,.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}
.nav-inner{max-width:1240px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:18px}
.back{display:inline-flex;align-items:center;gap:8px;color:#fff;font-family:'Outfit';font-weight:600;font-size:14px;opacity:.9;transition:.25s}
.back:hover{opacity:1;transform:translateX(-3px);color:var(--cyan-l)}
.logo-img{height:34px;display:block}
.nav .logo{margin:0 auto}
.nav-cta{padding:10px 20px;font-size:14px}
@media(max-width:640px){.nav .logo{display:none}.back span.t{display:none}}

/* ===== hero ===== */
.hero{position:relative;padding:150px 0 70px;background:radial-gradient(120% 120% at 78% 0%,#1b4e78 0%,var(--navy-d) 42%,var(--ink0) 100%);color:#fff;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(56,208,236,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,208,236,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(80% 80% at 70% 10%,#000,transparent);mask-image:radial-gradient(80% 80% at 70% 10%,#000,transparent)}
.hero .wrap{position:relative;z-index:2}
.hero-photo{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.hero-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,22,37,.95) 36%,rgba(9,22,37,.6) 72%,rgba(9,22,37,.32))}
.hero.has-photo{background:var(--ink0)}.hero.has-photo::after{opacity:.35}.hero.has-photo .icon-orb{display:none}
.hero h1{font-size:clamp(34px,6vw,66px);font-weight:800;margin:16px 0 14px;max-width:14ch}
.hero .tag{font-size:clamp(16px,2vw,20px);color:rgba(255,255,255,.82);max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.meta span{font-family:'Outfit';font-weight:600;font-size:12.5px;letter-spacing:1px;padding:8px 15px;border-radius:50px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#dff3f9}
.icon-orb{position:absolute;top:120px;right:-40px;width:340px;height:340px;opacity:.16;color:var(--cyan-l);z-index:1}
.icon-orb svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.2}

/* ===== body ===== */
section.pad{padding:66px 0}
.lead{font-size:clamp(17px,2vw,21px);color:var(--ink);max-width:70ch;line-height:1.65}
.lead b{color:var(--navy)}
.sec-h{font-family:'Outfit';font-weight:700;font-size:13px;letter-spacing:2.5px;text-transform:uppercase;color:var(--cyan-d);margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:8px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:0 20px 44px rgba(20,63,99,.10);border-color:rgba(31,166,196,.35)}
.card .ci{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,var(--cyan),var(--cyan-l));display:flex;align-items:center;justify-content:center;margin-bottom:14px;color:#04222c;font-weight:800;font-family:'Outfit';font-size:17px}
.card h3{font-size:18px;color:var(--navy);margin-bottom:7px;letter-spacing:-.5px}
.card p{font-size:14.5px;color:var(--muted);line-height:1.55}
.incl{background:var(--bg);border-radius:20px;padding:34px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
.chips span{font-family:'Outfit';font-weight:600;font-size:13.5px;padding:9px 16px;border-radius:50px;background:#fff;border:1px solid var(--line);color:var(--navy)}
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
@media(max-width:820px){.split{grid-template-columns:1fr;gap:26px}}
.hl li{list-style:none;position:relative;padding:11px 0 11px 30px;border-top:1px solid var(--line);font-size:15.5px;color:var(--ink)}
.hl li:first-child{border-top:none}
.hl li::before{content:"";position:absolute;left:2px;top:17px;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(31,166,196,.16)}
.specbox{background:linear-gradient(160deg,var(--navy),var(--navy-dd));color:#fff;border-radius:20px;padding:30px}
.specbox .sr{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid rgba(255,255,255,.12)}
.specbox .sr:first-child{border-top:none}
.specbox .sk{color:rgba(255,255,255,.55);font-size:13px;font-family:'Outfit';letter-spacing:1px;text-transform:uppercase}
.specbox .sv{font-family:'Outfit';font-weight:600;font-size:14.5px;text-align:right}

/* ===== CTA + footer ===== */
.cta{background:linear-gradient(135deg,var(--navy),var(--navy-dd));color:#fff;text-align:center;padding:64px 24px;position:relative;overflow:hidden}
.cta h2{font-size:clamp(26px,4vw,42px);font-weight:800;margin-bottom:10px}
.cta p{color:rgba(255,255,255,.8);margin-bottom:24px}
.cta .g{position:absolute;width:400px;height:400px;border-radius:50%;background:var(--cyan);filter:blur(120px);opacity:.22;top:-160px;left:50%;transform:translateX(-50%)}
.foot{background:var(--ink0);color:rgba(255,255,255,.6);text-align:center;padding:26px;font-size:13.5px}
.foot a{color:var(--cyan-l)}

/* ===== coming soon ===== */
.coming{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(120% 120% at 50% 0%,#1b4e78 0%,var(--navy-d) 45%,var(--ink0) 100%);color:#fff;padding:120px 24px 60px;position:relative;overflow:hidden}
.coming::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(56,208,236,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(56,208,236,.06) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(60% 60% at 50% 40%,#000,transparent);mask-image:radial-gradient(60% 60% at 50% 40%,#000,transparent)}
.coming .in{position:relative;z-index:2;max-width:640px}
.coming .cap{display:inline-flex;align-items:center;gap:9px;font-family:'Outfit';font-weight:600;font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--cyan-l);border:1px solid rgba(56,208,236,.4);padding:8px 18px;border-radius:50px;margin-bottom:26px}
.coming .cap .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan-l);box-shadow:0 0 12px var(--cyan-l);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.4}}
.coming h1{font-size:clamp(46px,10vw,110px);font-weight:800;letter-spacing:-3px;background:linear-gradient(180deg,#fff,#8fd4e6);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:.95}
.coming .sub{font-size:clamp(17px,2.4vw,22px);color:rgba(255,255,255,.8);margin:22px auto 34px;max-width:52ch}
.coming .gp{position:absolute;width:520px;height:520px;border-radius:50%;background:var(--cyan);filter:blur(150px);opacity:.2;top:-160px;left:50%;transform:translateX(-50%)}
.reveal{opacity:0;transform:translateY(20px);transition:.7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
</style>
</head>

/* ============ RENDER ============ */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function qp(k){return new URLSearchParams(location.search).get(k);}

function renderService(d){
  var caps=d.caps.map(function(c,i){return '<div class="card reveal"><div class="ci">'+(i+1<10?'0':'')+(i+1)+'</div><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>';}).join('');
  var chips=(d.incl||[]).map(function(x){return '<span>'+esc(x)+'</span>';}).join('');
  var label=d.kind==='process'?'The phase in detail':'What we deliver';
  var inclLabel=d.kind==='process'?'Deliverables':"What's included";
  return heroHTML(d)+
   '<section class="pad"><div class="wrap">'+
     '<p class="lead reveal">'+esc(d.lead)+'</p>'+
   '</div></section>'+
   '<section class="pad" style="padding-top:0"><div class="wrap">'+
     '<div class="sec-h reveal">'+label+'</div>'+
     '<div class="cards">'+caps+'</div>'+
     '<div class="incl reveal" style="margin-top:34px"><div class="sec-h" style="margin-bottom:14px">'+inclLabel+'</div><div class="chips">'+chips+'</div></div>'+
   '</div></section>'+
   ctaHTML(d.title);
}

function renderProject(d){
  var specs=d.scope.map(function(s){return '<div class="sr"><span class="sk">'+esc(s[0])+'</span><span class="sv">'+esc(s[1])+'</span></div>';}).join('');
  var hl=d.hl.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
  return heroHTML(d)+
   '<section class="pad"><div class="wrap split">'+
     '<div class="reveal"><p class="lead">'+esc(d.lead)+'</p>'+
       '<div class="sec-h" style="margin:32px 0 6px">Project highlights</div><ul class="hl">'+hl+'</ul></div>'+
     '<div class="specbox reveal"><div class="sec-h" style="color:var(--cyan-l);margin-bottom:8px">At a glance</div>'+specs+'</div>'+
   '</div></section>'+
   ctaHTML(d.title,true);
}

function heroHTML(d){
  var meta='';
  if(d.kind==='project') meta='<div class="meta"><span>'+esc(d.sector)+'</span><span>'+esc(d.location)+'</span></div>';
  else meta='<div class="meta"><span>Sedra Electric</span><span>Egypt · UAE · KSA</span></div>';
  var photo=d.img?'<div class="hero-photo" style="background-image:url('+d.img+')"></div>':'';
  return '<section class="hero'+(d.img?' has-photo':'')+'">'+photo+'<div class="icon-orb">'+(ORB[d.orb]||ORB.service)+'</div><div class="wrap">'+
    '<span class="eyebrow">'+esc(d.eyebrow||d.sector||'Sedra Electric')+'</span>'+
    '<h1>'+esc(d.title)+'</h1>'+
    '<p class="tag">'+esc(d.tag)+'</p>'+meta+
   '</div></section>';
}

function ctaHTML(name,proj){
  var line=proj?'Planning something similar? Let’s build it together.':'Interested in '+esc(name)+'? Let’s talk.';
  return '<section class="cta"><div class="g"></div>'+
    '<h2>'+line+'</h2>'+
    '<p>Tell us about your space and our engineers will get back to you.</p>'+
    '<a href="index.html#contact" class="btn btn-primary">Request a Consultation</a>'+
   '</section>'+
   '<footer class="foot">© Sedra Electric — Reach the Nature Energy. <a href="index.html">Back to home</a></footer>';
}

function renderComing(d){
  document.querySelector('.nav').style.display='none';
  return '<section class="coming"><div class="gp"></div><div class="in">'+
    '<span class="cap"><span class="dot"></span>Coming Soon</span>'+
    '<h1>'+esc(d.title)+'</h1>'+
    '<p class="sub">'+esc(d.sub)+'</p>'+
    '<a href="index.html" class="btn btn-ghost">← Back to Sedra Electric</a>'+
   '</div></section>';
}

(function(){
  var id=qp('id');
  var d=DATA[id];
  var app=document.getElementById('app');
  if(!d){
    app.innerHTML=heroHTML({title:'Page not found',eyebrow:'Sedra Electric',tag:'The page you’re looking for isn’t here.'})+ctaHTML('our solutions');
    document.title='Sedra Electric';
  } else {
    document.title=d.title+' — Sedra Electric';
    if(d.kind==='coming') app.innerHTML=renderComing(d);
    else if(d.kind==='project') app.innerHTML=renderProject(d);
    else app.innerHTML=renderService(d);
  }
  try{
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.14});
    document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
  }catch(err){ document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');}); }
  setTimeout(function(){ if(!document.querySelector('.reveal.in')){ document.querySelectorAll('.reveal').forEach(function(el){el.classList.add('in');}); } },2000);
  window.scrollTo(0,0);
})();
</script>
